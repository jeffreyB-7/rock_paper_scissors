<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Rock Paper Scissors</h1>
  <p>Make your pick:</p>

  <div class="choices">
    <button class="choice" data-choice="rock">Rock</button>
    <button class="choice" data-choice="paper">Paper</button>
    <button class="choice" data-choice="scissors">Scissors</button>
  </div>

  <div class="result-area">
    <p>You picked: <span id="player-pick">-</span></p>
    <p>Computer picked: <span id="computer-pick">-</span></p>
    <p id="result">Click a button to play!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
