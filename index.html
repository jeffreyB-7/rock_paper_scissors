<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The game sits in its own centered column; the ticker comes after it -->
  <main class="game">
  <h1>Rock Paper Scissors</h1>
  <p>Make your pick:</p>

  <div class="choices">
    <button class="choice" data-choice="rock">Rock</button>
    <button class="choice" data-choice="paper">Paper</button>
    <button class="choice" data-choice="scissors">Scissors</button>
  </div>

  <!-- The two hands. They show a fist at the start, then the real picks. -->
  <div class="arena">
    <div class="side">
      <p class="side-label">You</p>
      <div class="hand" id="player-hand">&#9994;</div>
    </div>
    <div class="side">
      <p class="side-label">Computer</p>
      <div class="hand" id="computer-hand">&#9994;</div>
    </div>
  </div>
  <p id="countdown"></p>

  <p id="scoreboard">
    Win %: <span id="win-percent">0%</span> |
    Win Streak: <span id="streak">0</span> |
    Best Streak: <span id="best-streak">0</span>
  </p>

  <div class="result-area">
    <p>You picked: <span id="player-pick">-</span></p>
    <p>Computer picked: <span id="computer-pick">-</span></p>
    <p id="result">Click a button to play!</p>
  </div>

  <button id="reset">Reset</button>
  </main>

  <!-- Ticker bar: script.js fills the track with the quotes -->
  <div id="ticker">
    <div id="ticker-track"></div>
  </div>

  <script src="quotes.js"></script>
  <script src="script.js"></script>
</body>
</html>
